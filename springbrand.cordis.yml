- insert:
    - id: oauth-mcp-web-manager
      name: '@dsh-external/dsh-oauth-mcp-client/web-manager'
      config:
        profilePatchPath: !!js dshHomePath('profiles/web/cordis.patch.yml')

    - id: springbrand-mcp-oauth
      name: '@dsh-external/dsh-oauth-mcp-client'
      config:
        serverName: springbrand
        url: https://connector.springbrand.ai/mcp
        credentialRef: SPRINGBRAND_MCP_OAUTH_PRODUCTION
        failOnStartupError: true
